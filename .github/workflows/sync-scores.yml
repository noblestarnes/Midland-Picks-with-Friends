name: Sync College Football Scores to Firestore

# GitHub's cron scheduler is best-effort and quietly drops triggers when it is
# busy (Saturdays are its busiest time), so this no longer depends on a cron
# tick every 15 minutes. Instead, cron only needs to "wake" the job once in a
# while. Once awake, the job stays running and syncs every 15 minutes by
# itself until the game window ends (or ~5.5 hours pass, then the next wake-up
# takes over). Game windows are evaluated in Central time inside the job, so
# daylight saving changes need no edits here.
#
# Game windows (Central): Thu 6pm-midnight, Fri 6pm-Sat 1am, Sat 11am-Sun 2am.
on:
  schedule:
    # Wake-ups at odd minutes (off GitHub's :00/:15/:30/:45 rush), every hour
    # on the UTC days that can contain a game window (Thu-Sun).
    - cron: '7 * * * 0,4,5,6'
    - cron: '37 * * * 0,4,5,6'
  workflow_dispatch: {}   # "Run workflow" in the Actions tab starts a sync loop right now

# Only one sync loop at a time; extra wake-ups queue instead of piling up.
concurrency:
  group: score-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync live scores every 15 minutes while a game window is open
        shell: bash
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          in_window() {
            d=$(TZ=America/Chicago date +%u)     # 1=Mon ... 7=Sun
            h=$(TZ=America/Chicago date +%-H)    # 0-23, Central
            case "$d" in
              4) [ "$h" -ge 18 ] ;;
              5) [ "$h" -lt 2 ] || [ "$h" -ge 18 ] ;;
              6) [ "$h" -lt 1 ] || [ "$h" -ge 11 ] ;;
              7) [ "$h" -lt 2 ] ;;
              *) return 1 ;;
            esac
          }
          # Manual runs always do one pass, even outside a window.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && ! in_window; then
            python3 scripts/firestore_sync.py
            exit 0
          fi
          if ! in_window; then
            echo "Outside game window (Central: $(TZ=America/Chicago date)). Nothing to do."
            exit 0
          fi
          end=$(( $(date +%s) + 340*60 ))
          while in_window && [ "$(date +%s)" -lt "$end" ]; do
            python3 scripts/firestore_sync.py || echo "Sync pass failed; will retry next cycle."
            sleep 900
          done
          echo "Loop finished (window closed or time cap reached)."
